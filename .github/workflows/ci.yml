name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: personalos
          POSTGRES_DB: personalos_demo
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U personalos -d personalos_demo"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      DATABASE_URL: postgresql://personalos@127.0.0.1:55432/personalos_demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install repository workspace links
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare and install exact pinned motion-ball build dependencies
        run: npm run setup
      - name: Build the current alpha.8 web runtime
        run: npm run build:web
      - name: Check source provenance, JavaScript syntax and public-file patterns
        run: npm run check
      - name: Run contracts, real API/static HTTP smoke and current web regressions
        run: npm test
      - name: Install independent studio dependencies
        run: npm run setup:studio
      - name: Type-check and build independent studio
        run: npm run check:studio && npm run build:studio
