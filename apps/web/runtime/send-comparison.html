<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Send continuity · 四种机制</title><link rel="stylesheet" href="./chat/contextual-chat.css"><link rel="stylesheet" href="./send-comparison.css"><script src="./chat/vendor/gsap/gsap.min.js"></script></head><body class="living-study">
<main class="send-study"><aside class="study-controls" tabindex="0" aria-label="发送机制与测试设置"><p class="eyebrow">SEND CONTINUITY STUDY</p><h1>同一段文字，<br>四个发送过程</h1><p class="study-note">只比较输入到消息的接续。Ball 外层弹出不在这个预览中，也没有改动。</p><div role="group" aria-label="选择发送机制" class="variant-options"><button type="button" data-variant="A" aria-pressed="true"><b>A · 输入材质转移</b><span>文字和底色一起轻收，移动后恢复原尺寸</span></button><button type="button" data-variant="B" aria-pressed="false"><b>B · 先成泡，再移动</b><span>先在输入位置收成消息，再整体进入阅读位置</span></button><button type="button" data-variant="C" aria-pressed="false"><b>C · 文字先走，背景跟随</b><span>保留输入框，文字轻抬，消息背景随后接住</span></button><button type="button" data-variant="D" aria-pressed="false"><b>D · ChatGPT 参考</b><span>文字先沿弧线移动，接近落点时背景出现</span></button></div><div class="study-options"><label><input type="checkbox" id="slow-send"> 0.2× 慢放（下一条）</label><label><input type="checkbox" id="reduce-send"> 减少动态（此预览）</label></div><p class="sample-label">放入测试文字</p><div class="sample-buttons"><button type="button" data-sample="short">短句</button><button type="button" data-sample="multiline">多行</button><button type="button" data-sample="long">长文</button></div><output id="study-status" aria-live="off">准备中</output><p><a id="full-popup-link" href="./index.html?sendVariant=A">在原有 Ball 弹出中试用当前机制 ↗</a></p><p class="study-caveat">原创 Web 适配。A/B/C 借鉴发送状态交接；D 参考所提供的 ChatGPT 截图。路径与时间为设计值，并非原生参数。</p></aside><section class="study-chat" aria-label="真实输入与发送预览"><button id="reopen-preview" type="button" hidden aria-controls="ai-canvas" aria-expanded="true">打开发送预览</button><section id="ai-canvas" data-send-variant="A"><header class="canvas-head"><div class="canvas-identity"><strong>发送预览</strong><span id="agent-status">本地演示</span></div><button id="ai-close" type="button" aria-label="关闭发送预览">×</button></header><div id="canvas-scroll" class="canvas-scroll"><div class="canvas-intro"><h2>先试一条短句</h2><p>文字从真实输入位置开始，最终回到原生消息节点。</p><div class="prompt-list"></div></div><div id="messages" aria-live="off"></div></div><div class="canvas-composer"><div class="composer-wrap"><textarea id="question" rows="1" placeholder="输入问题…" aria-label="聊天问题"></textarea><button id="send-button" type="button" aria-label="发送消息">发送</button></div><div class="composer-note"><span>本地演示 · 未接入 AI</span><button id="simulate-error" type="button">模拟错误</button></div></div></section></section></main><script type="module" src="./send-comparison.js"></script></body></html>
